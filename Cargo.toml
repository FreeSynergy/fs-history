[workspace]
resolver = "2"
members = ["crates/fs-history-core", "crates/fs-history-hub", "crates/fs-history-server", "crates/fs-history-app", "crates/fs-history"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

# Window resize crash (wgpu validation error when the window is enlarged), and the fast update path: restyle only the
# nodes an incremental update replaced (Thread B). Same pins as fs-tasks (coding.md section 8).
[patch.crates-io]
blinc_app = { git = "https://github.com/FreeSynergy/blinc-app-fix", rev = "5180d4eae80034d851d98464861f098d69eceaf0" }
blinc_layout = { git = "https://github.com/FreeSynergy/blinc-layout-fix", rev = "cb17db8111f2037473e6e02b6784628ca0dca151" }
