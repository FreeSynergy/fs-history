[package]
name = "fs-history-hub"
description = "Adapter from the FreeSynergy hub to the history core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-history-core = { path = "../fs-history-core" }
fs-hub-client = { git = "https://github.com/FreeSynergy/fs-hub", tag = "v0.2.0" }
# The hub speaks the store version of its own tag; only the activity id type is named from it.
fs-store-hub = { package = "fs-store", git = "https://github.com/FreeSynergy/fs-store", tag = "v0.2.0" }
fs-store = { git = "https://github.com/FreeSynergy/fs-store", tag = "v0.3.0" }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
serde_json = "1"
fs-hub = { git = "https://github.com/FreeSynergy/fs-hub", tag = "v0.2.0" }
