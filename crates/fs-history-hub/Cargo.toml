[package]
name = "fs-history-hub"
description = "Adapter from the FreeSynergy hub to the history core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-history-core = { path = "../fs-history-core" }
fs-hub-client = { git = "https://github.com/FreeSynergy/fs-hub", tag = "v0.4.0" }
# The hub speaks fs-objects 0.5 (fs-hub v0.4.0); only the activity type is named from it.
fs-objects-hub = { package = "fs-objects", git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.5.0" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.6.0" }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
serde_json = "1"
fs-hub = { git = "https://github.com/FreeSynergy/fs-hub", tag = "v0.4.0" }
