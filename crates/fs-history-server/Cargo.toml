[package]
name = "fs-history-server"
description = "Cap'n Proto server of FreeSynergy history: the contract history.capnp, in front of any History provider, with the type catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "fs_history_server"

[dependencies]
fs-history-core = { path = "../fs-history-core" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.11", features = ["rpc"] }
fs-types = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.11", features = ["rpc"] }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
capnp = "0.27"
capnp-rpc = "0.27"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
